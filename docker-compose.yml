services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: finora-db
    restart: always
    environment:
      - POSTGRES_USER=finora
      - POSTGRES_PASSWORD=finora
      - POSTGRES_DB=finora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora -d finora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finora-redis
    restart: always
    networks:
      - finora-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: finora-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=finora_admin
      - MINIO_ROOT_PASSWORD=finora_storage_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - finora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: finora-whatsapp
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=https://evo.gestaofinora.com.br
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=finora_secret_key_whatsapp
      - CORS_ORIGIN=*
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://finora:finora@db:5432/finora?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=finora-evo
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
    networks:
      - finora-network

  traefik:
    image: traefik:v3.0
    container_name: finora-traefik
    restart: always
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    networks:
      - finora-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: finora-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - traefik
    networks:
      - finora-network

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: finora-headroom
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - finora-network

networks:
  finora-network:
    name: finora-network
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  evolution_data:
